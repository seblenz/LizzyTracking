<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LizzyTracker Icon Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #f8f5f2;
        }
        h1 { color: #7c9885; }
        .icon-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0;
        }
        .icon-item {
            text-align: center;
        }
        .icon-item canvas {
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .icon-item p {
            margin: 5px 0;
            font-size: 12px;
            color: #666;
        }
        button {
            background: #7c9885;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover {
            background: #5a7663;
        }
        .instructions {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>LizzyTracker Icon Generator</h1>

    <div class="instructions">
        <h3>Instructions:</h3>
        <ol>
            <li>Click "Generate All Icons" to create the PWA icons</li>
            <li>Click "Download All" to download a ZIP file with all icons</li>
            <li>Place the downloaded icons in the <code>/icons</code> folder</li>
        </ol>
    </div>

    <button onclick="generateAllIcons()">Generate All Icons</button>
    <button onclick="downloadAll()">Download All Icons</button>

    <div id="icon-preview" class="icon-preview"></div>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        const canvases = {};

        function generateIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#7c9885');
            gradient.addColorStop(1, '#5a7663');

            // Draw rounded rectangle background
            const radius = size * 0.15;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();

            // Draw heart shape
            const heartSize = size * 0.4;
            const centerX = size / 2;
            const centerY = size * 0.45;

            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.beginPath();

            // Heart path
            const topCurveHeight = heartSize * 0.3;
            ctx.moveTo(centerX, centerY + heartSize * 0.35);

            // Left curve
            ctx.bezierCurveTo(
                centerX - heartSize * 0.5, centerY + heartSize * 0.1,
                centerX - heartSize * 0.5, centerY - topCurveHeight,
                centerX, centerY - topCurveHeight * 0.5
            );

            // Right curve
            ctx.bezierCurveTo(
                centerX + heartSize * 0.5, centerY - topCurveHeight,
                centerX + heartSize * 0.5, centerY + heartSize * 0.1,
                centerX, centerY + heartSize * 0.35
            );

            ctx.fill();

            // Draw small seedling/sprout inside heart
            ctx.fillStyle = '#7c9885';
            const sproutX = centerX;
            const sproutY = centerY + heartSize * 0.05;
            const sproutSize = heartSize * 0.25;

            // Stem
            ctx.beginPath();
            ctx.moveTo(sproutX, sproutY + sproutSize * 0.5);
            ctx.lineTo(sproutX, sproutY - sproutSize * 0.2);
            ctx.lineWidth = size * 0.02;
            ctx.strokeStyle = '#7c9885';
            ctx.stroke();

            // Left leaf
            ctx.beginPath();
            ctx.ellipse(sproutX - sproutSize * 0.2, sproutY - sproutSize * 0.1, sproutSize * 0.15, sproutSize * 0.25, -Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            // Right leaf
            ctx.beginPath();
            ctx.ellipse(sproutX + sproutSize * 0.2, sproutY - sproutSize * 0.15, sproutSize * 0.15, sproutSize * 0.25, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            // Add "LT" text at bottom
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.font = `bold ${size * 0.12}px -apple-system, BlinkMacSystemFont, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText('LT', centerX, size * 0.88);

            return canvas;
        }

        function generateAllIcons() {
            const preview = document.getElementById('icon-preview');
            preview.innerHTML = '';

            sizes.forEach(size => {
                const canvas = generateIcon(size);
                canvases[size] = canvas;

                const item = document.createElement('div');
                item.className = 'icon-item';

                const displayCanvas = document.createElement('canvas');
                displayCanvas.width = Math.min(size, 128);
                displayCanvas.height = Math.min(size, 128);
                const ctx = displayCanvas.getContext('2d');
                ctx.drawImage(canvas, 0, 0, displayCanvas.width, displayCanvas.height);

                item.appendChild(displayCanvas);

                const label = document.createElement('p');
                label.textContent = `${size}x${size}`;
                item.appendChild(label);

                const downloadBtn = document.createElement('button');
                downloadBtn.textContent = 'Download';
                downloadBtn.style.padding = '5px 10px';
                downloadBtn.style.fontSize = '12px';
                downloadBtn.onclick = () => downloadIcon(size);
                item.appendChild(downloadBtn);

                preview.appendChild(item);
            });
        }

        function downloadIcon(size) {
            const canvas = canvases[size];
            if (!canvas) return;

            const link = document.createElement('a');
            link.download = `icon-${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function downloadAll() {
            if (Object.keys(canvases).length === 0) {
                generateAllIcons();
            }

            // Download each icon with a small delay
            sizes.forEach((size, index) => {
                setTimeout(() => downloadIcon(size), index * 200);
            });
        }

        // Generate icons on page load
        window.onload = generateAllIcons;
    </script>
</body>
</html>
